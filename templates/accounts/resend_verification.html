{% extends "base.html" %}
{% block title %}Send a verification code — {{ SITE_NAME }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="container" style="max-width: 460px">
  <h1 class="mb-3">Verify your email</h1>
  <form method="post" class="panel" novalidate data-once>
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button type="submit" class="btn btn-primary w-100">Send code</button>
  </form>
</div>
{% endblock %}
