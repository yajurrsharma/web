{% extends "accounts/_layout.html" %}
{% block title %}Change password — {{ SITE_NAME }}{% endblock %}
{% block account %}
<h1 class="mb-3">Change password</h1>
<form method="post" class="panel" style="max-width: 520px" novalidate data-once>
  {% csrf_token %}
  {% include "includes/form_fields.html" %}
  <button class="btn btn-primary" type="submit">Change password</button>
</form>
{% endblock %}
