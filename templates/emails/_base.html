<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ store.store_name }}</title></head>
<body style="margin:0;padding:0;background:#FAF3E3;font-family:Arial,Helvetica,sans-serif;color:#2B1A12;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAF3E3;"><tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border:1px solid #EADCC0;border-radius:8px;">
<tr><td style="padding:20px 28px;border-bottom:3px solid #B0802A;">
  <div style="font-family:Georgia,serif;font-size:24px;color:#6E1423;">{{ store.store_name }}</div>
</td></tr>
<tr><td style="padding:24px 28px;font-size:15px;line-height:1.6;">
{% block body %}{% endblock %}
</td></tr>
<tr><td style="padding:16px 28px;border-top:1px solid #EADCC0;font-size:12px;color:#6E5B4C;">
  {% if store.support_email %}Questions? Reply to this email or write to {{ store.support_email }}.{% endif %}
  {% if store.legal_name %}<br>{{ store.legal_name }}{% if store.gstin %} · GSTIN {{ store.gstin }}{% endif %}{% endif %}
</td></tr>
</table></td></tr></table>
</body></html>
