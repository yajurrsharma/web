{% extends "base.html" %}
{% block title %}Page not found — {{ SITE_NAME }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="container text-center py-5" style="max-width: 640px">
  <p style="color: var(--brass)">Error 404</p>
  <h1>Page not found</h1>
  <p class="lead">The page may have moved, or the link is incomplete. Try searching, or browse all products.</p>
  <div class="d-flex gap-2 justify-content-center mt-3">
    <a class="btn btn-primary" href="{% url 'products:shop' %}">Browse products</a>
    <a class="btn btn-outline-burgundy" href="/">Home</a>
  </div>
</div>
{% endblock %}
